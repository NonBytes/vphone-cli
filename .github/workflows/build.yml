name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcbeautify
        run: command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version
          xcbeautify --version

      - name: Package notice regressions
        run: zsh scripts/tests/stage-package-notices-tests.zsh

      - name: Active display capture regressions
        run: zsh VPhoneDaemon/Tests/run-display-capture-tests.sh

      - name: Active display metrics regressions
        run: zsh VPhoneDaemon/Tests/run-display-metrics-tests.sh

      - name: Process capture pipe regressions
        run: zsh VPhoneDaemon/Tests/run-process-pipe-tests.sh

      - name: Process output capture regressions
        run: zsh VPhoneDaemon/Tests/run-process-output-tests.sh

      - name: Build VPhone.bundle
        env:
          SWIFT_JOBS: "4"
        run: |
          set -o pipefail
          mkdir -p .build
          xcodebuild -workspace VPhone.xcworkspace -scheme VPhone \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/XcodeBundle -jobs 4 build 2>&1 \
            | tee .build/xcodebuild.log \
            | xcbeautify --quiet --disable-logging --renderer github-actions

      - name: Build Launchpad and independent Pentest Tools
        run: |
          set -o pipefail
          xcodebuild -project VPhoneLaunchpad/VPhoneLaunchpad.xcodeproj -scheme VPhoneLaunchpad \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/XcodeLaunchpad -jobs 4 build 2>&1 \
            | tee .build/launchpad-xcodebuild.log \
            | xcbeautify --quiet --disable-logging --renderer github-actions

      # Quiet mode hides unannotated build-phase output, including the reason
      # a script phase failed. Keep the full log for that case.
      - name: Show raw build log
        if: failure()
        run: tail -n 300 .build/*xcodebuild.log

      - name: Upload raw build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: .build/*xcodebuild.log

      - name: Verify bundle
        run: |
          set -euo pipefail
          zsh VPhoneExecutable/VPhoneVirtualization/Build/ValidateBundle.sh \
            .build/XcodeBundle/Build/Products/Debug/VPhone.bundle

      - name: Device tree tests
        run: |
          set -o pipefail
          xcodebuild -workspace VPhone.xcworkspace -scheme FirmwarePatcherTests \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/XcodeBundle -jobs 2 \
            -only-testing:FirmwarePatcherTests/DeviceTreeGuestDeviceTests \
            -only-testing:FirmwarePatcherTests/CustomFirmwareDriverKitTests test 2>&1 \
            | tee .build/device-tree-tests.log \
            | xcbeautify --quiet --disable-logging --renderer github-actions

      - name: Check RPC result schemas
        run: |
          zsh VPhoneDaemon/Tests/run-result-schema-check.sh \
            --icli .build/XcodeBundle/SourcePackages/checkouts/icli

      # Xcode before 27 drops arm64e.x1 without a warning, and M6 hosts need
      # that slice of the AMFI allowlist tool.
      - name: Verify vphone-escalator slices
        run: |
          set -euo pipefail
          helper=.build/XcodeBundle/Build/Products/Debug/VPhone.bundle/Contents/MacOS/vphone-escalator
          archs=" $(lipo -archs "$helper") "
          echo "vphone-escalator:$archs"
          for arch in arm64e arm64e.x1; do
            [[ "$archs" == *" $arch "* ]] || { echo "::error::vphone-escalator lacks $arch"; exit 1; }
          done

      - name: Mac camera regression tests
        run: zsh VPhoneExecutable/VPhoneVirtualization/Camera/Tests/run-tests.sh

      - name: Guest proxy tests
        run: |
          zsh VPhoneExecutable/VPhoneVirtualization/Proxy/Tests/run-tests.sh
          zsh VPhoneExecutable/VPhoneVirtualization/Proxy/Tests/run-ca-tests.sh

      - name: Frida release tests
        run: zsh VPhoneExecutable/VPhoneVirtualization/Frida/Tests/run-tests.sh

      - name: Pentest tools regression tests
        run: zsh VPhoneExecutable/VPhoneVirtualization/Tests/run-pentest-tools-tests.sh

      - name: Sandbox Diff regression tests
        run: zsh VPhoneExecutable/VPhoneVirtualization/Tests/run-sandbox-diff-tests.sh

      - name: Network diagnostics regression tests
        run: zsh VPhoneExecutable/VPhoneVirtualization/Tests/run-network-diagnostics-tests.sh

      - name: App logs regression tests
        run: zsh VPhoneExecutable/VPhoneVirtualization/Tests/run-app-logs-tests.sh

      - name: Keychain Inspector regression tests
        run: zsh VPhoneExecutable/VPhoneVirtualization/Tests/run-keychain-inspector-tests.sh

      - name: Deep Link Tester regression tests
        run: zsh VPhoneExecutable/VPhoneVirtualization/Tests/run-deep-link-tester-tests.sh

      - name: Evidence Export regression tests
        run: zsh VPhoneExecutable/VPhoneVirtualization/Tests/run-evidence-export-tests.sh

      - name: Launchpad Pentest transport and feature regression tests
        run: |
          zsh VPhoneLaunchpad/Tests/PentestTransportTests.sh
          zsh VPhoneLaunchpad/Tests/PentestFeatureTests.sh
          zsh VPhoneLaunchpad/Tests/IPAExportTests.sh
          zsh VPhoneLaunchpad/Tests/GadgetPatchTests.sh
          zsh VPhoneLaunchpad/Tests/GadgetConnectionTests.sh
          zsh VPhoneLaunchpad/Tests/GadgetDeploymentTests.sh

      - name: Guest component tests
        run: |
          make -C VPhoneGuestComponents test-mach-ports-compat
          make -C VPhoneGuestComponents test-x1-task-exceptions
          make -C VPhoneGuestComponents test-ios16-surface
          make -C VPhoneGuestComponents test-ios18-gpu
          make -C VPhoneGuestComponents test-ios16-lab-policy
          make -C VPhoneGuestComponents test-loader-links
          make -C VPhoneGuestComponents test-vcam-dataplane
          make -C VPhoneGuestComponents test-vcam-prewarm
          make -C VPhoneGuestComponents test-vcam-drive-gate
          make -C VPhoneGuestComponents test-camfix-geometry
          make -C VPhoneGuestComponents test-camfix-session-reference
